name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .NET example — swap these steps for your stack if needed
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore /warnaserror
      - run: dotnet test --configuration Release --no-build

  notify:
    # always run, but only if secrets are available (not from forked PRs)
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
    runs-on: ubuntu-latest
    needs: [ci]
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORDWEBHOOK }}
      RESULT: ${{ needs.ci.result }} # 'success' | 'failure' | 'cancelled'
      REPO: ${{ github.repository }}
      REF: ${{ github.ref }}
      SHA: ${{ github.sha }}
      ACTOR: ${{ github.actor }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Post result to Discord
        run: |
          if [ "$RESULT" = "success" ]; then
            COLOR=5763719;  ICON="✅"; STATUS="Success"
          elif [ "$RESULT" = "failure" ]; then
            COLOR=15548997; ICON="❌"; STATUS="Failure"
          else
            COLOR=9807270;  ICON="⚠️"; STATUS="${RESULT^}"
          fi

          SHORT_SHA=${SHA::7}
          TITLE="$ICON Build $STATUS • $REPO"
          DESCRIPTION="**Ref:** \`${REF}\`\n**Commit:** \`${SHORT_SHA}\`\n**Actor:** \`${ACTOR}\`\n[View run](${RUN_URL})"

          # Send rich embed
          curl -sS -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg t "$TITLE" --arg d "$DESCRIPTION" --argjson c "$COLOR" \
            '{embeds: [{title:$t, description:$d, color:$c}]}')"
